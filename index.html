  <style>

    .editor{position:fixed;z-index:30;inset:0;overflow:auto;background:#fff}.editor-inner{max-width:520px;margin:auto;padding:17px 22px 32px}.editor-bar{display:flex;justify-content:space-between;align-items:center}.editor-bar button{border:0;background:transparent;font-size:16px}.editor-bar .save-link{color:var(--teal);font-weight:800}.editor h2{font-size:25px;line-height:1.2;margin:28px 0 8px}.editor-date{color:var(--muted);font-size:15px}.editor-date input{border:0;color:inherit;background:transparent;max-width:135px}.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:28px 0}.mood-choice{border:0;background:transparent;text-align:center;padding:0 1px;font-size:12px;color:var(--muted)}.mood-face{width:42px;height:42px;border-radius:50%;background:#f2f5f7;display:grid;place-items:center;margin:0 auto 7px;font-size:23px;filter:grayscale(1);opacity:.65}.mood-choice.active{color:var(--teal);font-weight:800}.mood-choice.active .mood-face{background:#dcf5f2;filter:none;opacity:1;box-shadow:0 0 0 2px var(--teal)}.memo-box{width:100%;height:148px;resize:vertical;border:0;background:#f4f7f9;border-radius:15px;padding:18px;font-size:15px;line-height:1.6;outline-color:var(--teal)}.counter{text-align:right;color:#9ca4ae;font-size:12px;margin:-27px 12px 19px;position:relative;pointer-events:none}.editor-section h3{font-size:16px;margin:22px 0 10px}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.photo-tile{height:80px;width:100%;object-fit:cover;border-radius:11px}.photo-add{height:80px;border:0;background:#f4f7f9;color:#9ea8b4;font-size:32px;border-radius:11px}.photo-wrap{position:relative}.photo-remove{position:absolute;top:2px;right:2px;border:0;border-radius:50%;background:#333a;color:white;width:22px;height:22px;font-size:14px}.editor .category-grid{grid-template-columns:repeat(3,1fr)}.editor .category-card{height:68px}.editor .category-card.active{outline:2px solid var(--c);outline-offset:-2px}.detail-chips{display:flex;flex-wrap:wrap;gap:7px}.detail-chip{border:0;border-radius:15px;background:#f4f6f8;padding:8px 11px;font-size:13px}.detail-chip.active{background:#e4f5f2;color:var(--teal);font-weight:750}.delete-btn{width:100%;margin-top:25px;border:0;background:#fff1f1;color:#c95b61;border-radius:14px;padding:13px;font-weight:750}

    .detail-chip{font-size:14px;padding:9px 12px}.add-item{border:1px dashed #a3c8c3;background:#f4fbfa;color:var(--teal);font-weight:750}.new-item{display:flex;gap:8px;margin-top:12px}.new-item input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}.new-item button{border:0;border-radius:12px;background:var(--teal);color:#fff;padding:10px 14px;font-size:14px;font-weight:750}.editor-section .optional{font-size:13px;color:var(--muted);font-weight:500}.editor-section .memo-box{margin-top:2px}.editor-when{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px}.editor-time{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}.editor-time input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;color:var(--ink);min-width:0}.record-time{font-size:12px;color:var(--muted);margin-left:8px}
    svg.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:370px){main{padding-left:16px;padding-right:16px}.topbar{padding-left:18px;padding-right:18px}.day{height:46px}.category-card{height:63px}.record-card{grid-template-columns:30px 56px minmax(0,1fr)}.record-thumb{width:56px;height:60px}.mood-face{width:36px;height:36px}}
    @media(min-width:760px){body{padding:20px}.app{border-radius:28px;min-height:calc(100dvh - 40px)}.bottom-nav{bottom:20px;border-radius:0 0 28px 28px}.editor{background:#eef2f3}.editor-inner{background:#fff;min-height:100dvh}.sheet{border-radius:24px;margin-bottom:18px}}

<body>
  <div class="app">
    <header class="topbar"><div class="brand">DayColor</div><button id="authBtn" class="top-action" aria-label="Google 계정 동기화"><svg class="icon" viewBox="0 0 24 24"><path d="M6 17a4 4 0 0 1-1-7.9 7 7 0 0 1 13.6 1.5A3.3 3.3 0 0 1 18 17H6Z"/><path d="m10 13 2-2 2 2M12 11v8"/></svg></button><img id="profile" class="profile hidden" alt="Google 프로필"></header>
    <main>
      <section id="homeView" class="view active">
        <p class="intro">오늘은 어떤 색으로<br>기록할까요?</p>
        <div class="month-control"><button id="prevMonth" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button id="nextMonth" aria-label="다음 달">›</button></div>
        <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div id="calendar" class="calendar"></div>
        <div id="dayPreview" class="day-preview"></div>
        <div id="homeCategories" class="category-grid"></div>
      </section>
      <section id="recordsView" class="view"><div class="view-title"><h1>기록</h1></div><div id="filters" class="filters"></div><h2 id="recordMonth" class="record-month"></h2><div id="recordList" class="record-list"></div></section>
      <section id="statsView" class="view"><div class="view-title"><h1>통계</h1></div><div class="stats-switch"><button data-stats-range="week">주간</button><button class="active" data-stats-range="month">월간</button><button data-stats-range="year">연간</button></div><div class="month-control"><button id="statsPrev" aria-label="이전 기간">‹</button><h2 id="statsMonth"></h2><button id="statsNext" aria-label="다음 기간">›</button></div><div id="statsContent"></div></section>
      <section id="myView" class="view"><div class="view-title"><h1>마이</h1></div><div class="settings-card"><h2>나의 카테고리</h2><div id="topicList"></div><button id="addTopicBtn" class="add-topic">＋ 새 카테고리 추가</button></div><div class="settings-card"><h2>계정 동기화</h2><p id="syncStatus" class="sync-info">Google로 동기화하면 여러 기기에서 같은 기록을 볼 수 있습니다. 로그인 전에는 이 브라우저에 저장됩니다.</p></div></section>
    </main>
    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-btn active" data-view="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3V10Z"/><path d="M9 20v-7h6v7"/></svg>홈</button>
      <button class="nav-btn" data-view="records"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="19" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>기록</button>
      <button id="addRecord" class="nav-add" aria-label="기록 추가">＋</button>
      <button class="nav-btn" data-view="stats"><svg viewBox="0 0 24 24"><path d="M5 20V13M10 20V8M15 20V11M20 20V4"/></svg>통계</button>
      <button class="nav-btn" data-view="my"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/></svg>마이</button>
    </nav>
  </div>
  <div id="editor" class="editor hidden" role="dialog" aria-modal="true" aria-label="하루 기록"><div class="editor-inner">
    <div class="editor-bar"><button id="closeEditor" aria-label="닫기">←</button><button id="saveRecord" class="save-link">저장</button></div>
    <h2>오늘은<br>어떤 하루였나요?</h2>
    <div class="editor-when"><label class="editor-date"><input id="recordDate" type="date" aria-label="기록 날짜"> <span id="dateWeekday"></span></label><label class="editor-time">시간 <input id="recordTime" type="time" step="60" aria-label="기록 시간"></label></div>
    <div class="editor-section"><h3>1. 카테고리 선택</h3><div id="editorCategories" class="category-grid"></div></div>
    <div id="detailSection" class="editor-section hidden"><h3>2. 보기 선택</h3><div id="detailChips" class="detail-chips"></div><div id="newItemRow" class="new-item hidden"><input id="newItemName" maxlength="20" placeholder="새 보기 이름" aria-label="새 보기 이름"><button id="saveNewItem">추가</button></div></div>
    <div class="editor-section"><h3>메모 <span class="optional">선택</span></h3><textarea id="recordMemo" class="memo-box" maxlength="500" placeholder="남기고 싶은 이야기가 있다면 적어 주세요."></textarea><div id="memoCounter" class="counter">0 / 500</div></div>
    <div class="editor-section"><h3>사진 <span class="optional">선택 · 최대 3장</span></h3><div id="photoGrid" class="photo-grid"></div><input id="photoInput" class="hidden" type="file" accept="image/*" multiple></div>
    <button id="deleteRecord" class="delete-btn hidden">이 기록 삭제</button>
  </div></div>
  <div id="topicOverlay" class="overlay hidden" role="dialog" aria-modal="true"><div class="sheet"><h2 id="topicFormTitle">새 카테고리</h2><label>이름<input id="topicName" maxlength="8" placeholder="예: 운동"></label><label>아이콘 문자<input id="topicIcon" maxlength="2" placeholder="예: ✦"></label><label>보기 (쉼표로 구분)<input id="topicItems" placeholder="예: 산책, 여행, 휴식"></label><div id="palette" class="palette"></div><button id="saveTopic" class="primary">저장</button><button id="closeTopic" class="primary" style="background:#edf1f3;color:var(--ink);margin-top:8px">닫기</button></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="firebase-config.js"></script>
  <script>
    window.DAYCOLOR_FIREBASE_CONFIG=window.DAYCOLOR_FIREBASE_CONFIG||null;
    const COLORS=['#2F9C95','#5E8FC7','#E98578','#D7A84E','#9A87C7','#79A88D','#7B9AA8'];
    const DEFAULT_TOPICS=[
    {id:'meal',name:'식사',icon:'🍴',color:'#D7A84E',items:['아침식사','점심식사','저녁식사','간식','커피','술']},
    {id:'sleep',name:'수면',icon:'☾',color:'#9A87C7',items:['푹 잤어요','보통이에요','잠이 부족해요','낮잠']},
    {id:'exercise',name:'운동',icon:'○',color:'#79A88D',items:['걷기','달리기','자전거','헬스','스트레칭']},
    {id:'work',name:'업무',icon:'▣',color:'#5E8FC7',items:['집중 업무','회의','기획','야근','재택근무']},
    {id:'mood',name:'기분',icon:'☺',color:'#E98578',items:['행복해요','뿌듯해요','평온해요','피곤해요','속상해요']},
    {id:'relation',name:'관계',icon:'♡',color:'#C681A5',items:['가족','연인','친구','동료','혼자만의 시간']},
    {id:'hobby',name:'취미',icon:'✦',color:'#2F9C95',items:['독서','영상','게임','낚시','만들기']},
    {id:'spend',name:'소비',icon:'◇',color:'#7B9AA8',items:['식비','쇼핑','교통','취미','생활비']}

      }catch(e){console.warn(e);$('#syncStatus').textContent='Google 동기화 연결을 확인해 주세요.'}
    }
    $$('.nav-btn').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#addRecord').onclick=()=>openEditor(null,selectedDay||todayKey());$('#prevMonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);selectedDay=null;renderCalendar();renderPreview()};$('#nextMonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);selectedDay=null;renderCalendar();renderPreview()};$('#statsPrev').onclick=()=>{statsCursor=new Date(statsCursor.getFullYear()-(statsRange==='year'?1:0),statsCursor.getMonth()-(statsRange==='month'?1:0),statsCursor.getDate()-(statsRange==='week'?7:0));renderStats()};$('#statsNext').onclick=()=>{statsCursor=new Date(statsCursor.getFullYear()+(statsRange==='year'?1:0),statsCursor.getMonth()+(statsRange==='month'?1:0),statsCursor.getDate()+(statsRange==='week'?7:0));renderStats()};$$('[data-stats-range]').forEach(b=>b.onclick=()=>{statsRange=b.dataset.statsRange;statsCursor=new Date();renderStats()});$('#saveNewItem').onclick=()=>{const name=$('#newItemName').value.trim(),topic=state.topics.find(t=>t.id===selectedCategories[0]);if(!topic)return notify('카테고리를 먼저 선택해 주세요.');if(!name)return notify('보기 이름을 입력해 주세요.');topic.items??=[];if(topic.items.some(i=>i.toLocaleLowerCase()===name.toLocaleLowerCase()))return notify('이미 있는 보기예요.');topic.items.push(name);selectedItem=name;$('#newItemName').value='';$('#newItemRow').classList.add('hidden');persist();renderEditorCategories();renderTopics();notify('새 보기를 추가했어요.')};$('#newItemName').onkeydown=e=>{if(e.key==='Enter'){$('#saveNewItem').click()}};$('#closeEditor').onclick=closeEditor;$('#saveRecord').onclick=saveRecord;$('#recordDate').onchange=updateDate;$('#recordMemo').oninput=()=>$('#memoCounter').textContent=$('#recordMemo').value.length+' / 500';$('#photoInput').onchange=async e=>{for(const file of [...e.target.files].slice(0,3-photoList.length))photoList.push(await compressPhoto(file));renderPhotos();e.target.value=''};$('#deleteRecord').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){state.deletedRecords??={};state.deletedRecords[editingId]=Date.now();state.records=state.records.filter(r=>r.id!==editingId);persist();renderAll();closeEditor();notify('기록을 삭제했어요.')}};$('#addTopicBtn').onclick=()=>openTopic();$('#closeTopic').onclick=()=>$('#topicOverlay').classList.add('hidden');$('#topicOverlay').onclick=e=>{if(e.target.id==='topicOverlay')$('#topicOverlay').classList.add('hidden')};$('#saveTopic').onclick=saveTopic;$('#authBtn').onclick=()=>fb?.login?fb.login().catch(e=>notify(e.code==='auth/unauthorized-domain'?'Firebase 승인된 도메인에 현재 주소를 추가해 주세요.':'Google 로그인을 완료하지 못했어요.')):notify('동기화 연결값을 먼저 설정해 주세요.');$('#profile').onclick=async()=>{if(!confirm('Google 계정 동기화를 종료할까요?'))return;try{clearTimeout(syncTimer);await fb?.save(state,fb.user?.uid);await fb?.logout()}catch{notify('동기화나 로그아웃을 완료하지 못했어요.')}};
    load();initFirebase();
  </script>
